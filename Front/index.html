<!doctype html>
<html lang="tg">
  <head>
    <meta charset="UTF-8" />
    <!-- Танҳо PNG. Логотипи нав растр аст; SVG-и кӯҳна дар ин ҷо мемонд ва
         браузер онро авлотар мешуморад, аз ин рӯ дар tab логотипи кӯҳна
         менамуд. -->
    <link rel="icon" type="image/png" sizes="32x32" href="/icon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icon-180.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#0a0a0f" />
    <meta name="color-scheme" content="dark light" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--
      Runs before the first paint so the page never flashes light on its way to
      dark. Dark is the default: only an explicit stored "light" opts out.
      useTheme() then reads this class back rather than keeping its own copy.
    -->
    <script>
      (function () {
        var theme = "dark";
        try {
          if (localStorage.getItem("theme") === "light") theme = "light";
        } catch (e) {
          /* storage blocked (private mode) — stay on the default */
        }
        if (theme === "dark") document.documentElement.classList.add("dark");
        document.documentElement.style.backgroundColor = theme === "dark" ? "#0a0a0f" : "#f7f8fc";
      })();
    </script>
    <meta name="description" content="Ихтисоси ман — платформаи роҳнамоии касбӣ барои ҷавонони Тоҷикистон" />
    <title>Ихтисоси ман — Роҳнамоии Касбӣ</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
