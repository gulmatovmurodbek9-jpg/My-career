    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />

    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#0a0a0f" />
    <meta name="color-scheme" content="dark light" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <script>
      (function () {
        var theme = "dark";
        try {
          if (localStorage.getItem("theme") === "light") theme = "light";
        } catch (e) {
          /* storage blocked (private mode) — stay on the default */
        }
        if (theme === "dark") document.documentElement.classList.add("dark");
        document.documentElement.style.backgroundColor = theme === "dark" ? "#0a0a0f" : "#f7f8fc";
      })();
    </script>
    <meta name="description" content="Ихтисоси ман — платформаи роҳнамоии касбӣ барои ҷавонони Тоҷикистон" />
