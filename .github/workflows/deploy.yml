name: Deploy to production

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'Mobile/**'
      - '.gitignore'
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  SSH_HOST: 62.238.33.236
  SSH_USER: root
  WEBROOT: /var/www/ikhtisosiman
  SITE_URL: https://ikhtisosiman.qobus.tj

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: Front/package-lock.json

      - name: Build frontend
        working-directory: Front
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL || '/api' }}
          VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID || '775960361578-tbnkgabcvooc25d3olgua5uo697ekp0t.apps.googleusercontent.com' }}
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Check for deploy secret
        id: gate
        run: |
          if [ -z "${{ secrets.SSH_PRIVATE_KEY }}" ]; then
            echo "::warning::SSH_PRIVATE_KEY is not set — skipping the push deploy. The server's autodeploy timer will pick this commit up within a minute."
            echo 'ready=false' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Set up SSH
        if: steps.gate.outputs.ready == 'true'
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' '62.238.33.236 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIPLGrZP+/dnG6oI5lgvcc4kKjseIC5DntMd0m3jZ6vqT' > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          cat >> ~/.ssh/config <<EOF
          Host production
            HostName $SSH_HOST
            User $SSH_USER
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            UserKnownHostsFile ~/.ssh/known_hosts
            ServerAliveInterval 30
          EOF
          chmod 600 ~/.ssh/config

      - name: Deploy backend
        if: steps.gate.outputs.ready == 'true'
        run: ssh production "bash -s -- ${{ github.sha }}" < scripts/deploy-server.sh

      - name: Publish frontend
        if: steps.gate.outputs.ready == 'true'
        run: |
          rsync -az --delete Front/dist/ production:$WEBROOT/
          ssh production "chown -R www-data:www-data $WEBROOT"

      - name: Smoke test
        if: steps.gate.outputs.ready == 'true'
        run: |
          set -e
          code=$(curl -fsS -o /dev/null -w '%{http_code}' "$SITE_URL/")
          echo "$SITE_URL/ -> $code"
          code=$(curl -fsS -o /dev/null -w '%{http_code}' "$SITE_URL/api/clusters")
          echo "$SITE_URL/api/clusters -> $code"

      - name: Clean up SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
