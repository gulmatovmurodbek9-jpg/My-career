<!doctype html>
<html lang="tg">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icon-180.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#0a0a0f" />
    <meta name="color-scheme" content="dark light" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <script>
      (function () {
        var theme = "dark";
        try {
          var saved = localStorage.getItem("theme");
          if (saved === "light") theme = "light";
          // 174: агар корбар худаш интихоб накарда бошад — танзими система.
          else if (!saved && window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches) theme = "light";
        } catch (e) {
          /* storage blocked (private mode) — stay on the default */
        }
        if (theme === "dark") document.documentElement.classList.add("dark");
        document.documentElement.style.backgroundColor = theme === "dark" ? "#0a0a0f" : "#f7f8fc";
        // Браузер бо JS: матни SEO-и пешсохта (.seo-prerender) то бор шудани React
        // ҳамчун матни оддӣ намоён буд. Роботҳои бе JS онро мисли пештара мебинанд.
        document.documentElement.classList.add("js");
      })();
    </script>
    <style>
      .js .seo-prerender { display: none; }
      .js #root:has(> .seo-prerender)::before {
        content: "";
        position: fixed;
        top: 50%;
        left: 50%;
        width: 36px;
        height: 36px;
        margin: -18px 0 0 -18px;
        border: 3px solid rgba(99, 102, 241, 0.2);
        border-top-color: #4f46e5;
        border-radius: 50%;
        animation: boot-spin 0.8s linear infinite;
      }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { .js #root:has(> .seo-prerender)::before { animation-duration: 2.4s; } }
    </style>
    <meta name="description" content="Ихтисоси ман — платформаи роҳнамоии касбӣ барои ҷавонони Тоҷикистон" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Ихтисоси ман" />
    <meta property="og:title" content="Ихтисоси ман — Роҳнамоии Касбӣ" />
    <meta property="og:description" content="Санҷиши ММТ, 884 ихтисос, 51 муассисаи олӣ, 77 коллеҷ ва нақшаи ҳуҷҷатсупорӣ — платформаи роҳнамоии касбӣ барои хатмкунандагони Тоҷикистон." />
    <meta property="og:image" content="https://ikhtisosiman.qobus.tj/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="tg_TJ" />
    <meta name="twitter:card" content="summary_large_image" />
    <title>Ихтисоси ман — Роҳнамоии Касбӣ</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
